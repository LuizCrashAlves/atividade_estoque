<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade objeto Date</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Sistema de Cadastro de Alunos</h1>
    <p>Preencha os dados para realizar o cadastro</p>
    <form id="form">
        <label>Nome:</label>
        <input type="text" id="nome" required>
        <br><br>
        <label>E-mail:</label>
        <input type="email" id="mail" required>
    </br></br>
        <label>Data de nascimento:</label>
        <input type="date" id="nasc" required>
    </br></br>
        <label>Curso:</label>
        <select id="curso" required>
            <option value="">Selecione</option>
            <option value="Desenvolvimento de Sistemas">Desenvolvimento de Sistemas</option>
            <option value="Informática">Informática</option>
            <option value="Jogos Digitais">Jogos Digitais</option>
        </select>
    </br></br>
        <label>Telefone</label>
        <input type="text" id="tele" required>
    </br></br>
        <button type="submit">Cadastrar</button>
    </form>
    <p id="mens"></p>
    <footer>
        <hr>
        <p id="men2"></p>
        <p id="data"></p>
    </footer>
    <script src="./index.js"></script>
</body>
</html>
